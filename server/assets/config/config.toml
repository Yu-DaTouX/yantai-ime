#
# Settings page
# 设置页面
#
[settings_page]
theme = "dark"

#
# General
# 通用
#
[general]
# Server 端诊断日志（默认关闭；不记录输入内容或候选文本）
diagnostic_log = false
# TSF 端批量诊断日志（默认关闭；不记录输入内容或候选文本）
tsf_diagnostic_log = false
# 悬浮工具栏
floating_toolbar = true
# 切换输入状态时在光标附近显示短暂提示（与悬浮工具栏独立，默认关闭）
caret_state_indicator = false
# 焦点切换到另一个输入框（包括其他窗口中的）时，也提示当前中英文状态（需先开启光标状态提示）
caret_state_indicator_on_focus = false
# 光标状态提示位置：top-left / top / top-right / bottom-left / bottom / bottom-right（top、bottom 为正上方、正下方）
caret_state_indicator_position = "top-left"
# 悬浮工具栏组件（中英文切换始终显示）
floating_toolbar_fullwidth = true
floating_toolbar_punctuation = true
floating_toolbar_character_set = true
floating_toolbar_translate = true
floating_toolbar_settings = true
# 悬浮工具栏用户缩放（相对系统 DPI），可选：0.75 / 1.0 / 1.25 / 1.5
floating_toolbar_scale = 1.0
# 悬浮工具栏图标尺寸（px，再乘 scale），可选：16–28
floating_toolbar_font_size = 22
# 悬浮工具栏自动隐藏：显示一段时间无交互后淡出，鼠标悬停时不隐藏，切换中英等状态时重新显示
floating_toolbar_auto_hide = false
# 自动隐藏延时（秒），可选：1–60
floating_toolbar_auto_hide_delay = 5
# 悬浮工具栏阴影（与候选窗一致的柔和阴影）
floating_toolbar_shadow = true
# Emoji
enable_emoji = true
# 翻页方式
paging_minus_equal = true
paging_comma_period = true
paging_brackets = false
paging_tab = true
paging_page_up_down = true
# 鼠标滚轮在候选窗口上翻页（默认开启）
# 依赖 Windows「当我悬停在非活动窗口上方时滚动它们」，该系统设置关闭时本项不生效
paging_mouse_wheel = true
candidate_arrow_navigation = true
# 横排候选时左右方向键移动高亮：光标在拼音串尾时右键移高亮，左键回到第一个候选后再按才移动光标（默认关闭）
candidate_horizontal_arrow_navigation = false
# 中文输入状态下显示英文前缀候选
cn_en_mixed_input = true
# 中英混输触发所需的最少字母数，范围 1–8
cn_en_mixed_input_min_chars = 2
# 首页最多展示的英文候选数，范围 1–3；保留中文首选，小候选页会减少英文项
cn_en_mixed_input_first_page_count = 1
# 候选词英文行：候选条下面固定一行，显示当前高亮候选的第一个英文词义（词性小号灰字跟随）。
# 释义来源依次是：随包覆盖表 zh_en_gloss.tsv、english.db、本地翻译模型（已安装时后台补查，缓存后显示）。
# 默认打开；关闭后 Ctrl+Enter / Ctrl+Shift+Enter 仍可用。
english_line = true
# 中文输入状态下输入恰好等于 emoji 关键词时显示 emoji 候选（最匹配的一个排在首选之后，不做前缀匹配）
emoji_mixed_input = true
# 中文输入状态下显示颜文字前缀候选（排在 emoji 之后）
kaomoji_mixed_input = false
# 中文输入状态下输入恰好等于符号编码（alpha、infinity、szq、xl，数字读音 yi → ① ⑴ ⒈，标点读音 dian → · 、、shuminghao → 《》 〈〉）时显示符号候选，首个紧跟首选，其余排在颜文字之后
symbol_mixed_input = false
# TODO: 极简模式。极简模式下，候选窗口使用 d2d 绘制，界面只作展示候选项，无其他功能。
clean_mode = false

#
# 整句联想：多音节输入时把整串拼音解码成一句，四个来源各一个开关，另有去重补位开关。
# 默认开启词格、Google 和神经速度档，神经效果档与去重补位默认关闭。
# 词格/Google 是传统 ngram 来源；神经两档是
# chinese-ime-lm 的 Transformer，还需模型文件在数据目录里，desktop 更准也更慢。
#
[association]
# 词格整句联想（kenlm 三元模型打分）。模型 sc.lm 不随安装包分发，要在设置页下载后才能开启
sentence_wordlattice = false
# Google 解码器整句联想
sentence_google = true
# 神经网络模型整句（效果优先 / desktop）：内部生成最多 12 条 Trigram 备选并挑选，不依赖 sentence_wordlattice 开关
sentence_neural_desktop = false
# 神经网络模型整句（速度优先 / keyboard）：同上；与 desktop 同时开启时各自独立给出结果
sentence_neural_keyboard = true
# 实验：用轻量神经模型结合最近上屏的前文，重排完整拼音对应的前 32 个词库候选（含单字与词组）
context_candidate_rerank = false
# 长词前缀补全：首选已是 prefix_completion_min_chars 个字以上、覆盖整串输入的词时，从词库里找以它开头的
# 更长的词（中华人民 → 中华人民共和国），挑最可能的一条放在第二位。首选不是词库词（整句猜的，如诗句前四字）
# 时只按拼音找；是词库词时按字找，切词残片不补。打分优先用 sentence_collocation_model 激活的万象等模型（不必
# 打开整句加成），没有时用 sc.lm，再没有用随包的神经模型。
prefix_completion = true
# 首选至少几个字才补，3~8。不进设置页，供配置文件高级调参。
prefix_completion_min_chars = 4
# 某个模型的首选与已有候选重复时，改为显示该模型排名最高的下一条不同结果
sentence_show_next_on_duplicate = false
# 在候选窗的整句候选后显示来源标签（〔Trigram〕〔Unigram〕〔神经D〕〔神经K〕〔万象〕〔八股〕〔墨奇〕）
sentence_source_badge = false
# octagram 语法模型（八股文，.gram 格式）：字级搭配强度表，与词表零耦合。总开关，一并接入
# 激活模型的全部能力：解码期逐边叠加搭配分一次，并把解码最优路径作为整句来源行显示。模型包
# 从设置页内置目录按需下载（万象 LTS 约 390MB、八股文词级约 197/39MB、白霜约 7MB），布局
# models/<id>/<id>.gram；模型未下载时开关不生效，词格静默降级。整句来源行：每个模型包
# 显示自己的标签（万象、八股、墨奇），目录外手填的 id 落回〔八股〕。
sentence_collocation_enabled = false
# 激活的模型包 id（单选）：默认留空 = 未选择任何模型（整句加成保持关闭）。在设置页下载
# 目录里的模型并单选激活后写入该模型 id；删除守卫只保护当前显式激活的包。也可手动放置
# 模型后直接填 id。
sentence_collocation_model = ""
# 搭配项的标定系数（log10 域；scorer 已把 .gram 的自然对数换算过来）。1.0 = librime 的同
# 相对量级，0 = 关闭加成。不进设置页，供配置文件高级调参。
sentence_collocation_weight = 1.0
# 词格里「词库权重 >= min_weight 的多音节整词」每条边加的分（log10），0 = 关闭（默认）。用来抵消
# 「拆成两个高频单字」的路径压过整词的偏差（gaidao 出「该到」而非「改到」）；开了会改变同音词
# 的取舍，打开前请用 engine/tests 的 eval_quanpin_sentence 对照。不进设置页，供配置文件高级调参。
sentence_phrase_bonus = 0.0
sentence_phrase_bonus_min_weight = 1000
# octagram 六参数，默认对齐万象现行（wanxiang.schema.yaml）：max/min 是搭配上下文与词的
# 码点长度上限/下限，penalty 是命中搭配、non/weak 是未命中/弱命中的惩罚，rear 是句尾项惩罚。
# 不进设置页，供配置文件高级调参。
sentence_collocation_max_length = 6
sentence_collocation_min_length = 2
sentence_collocation_penalty = -14.0
sentence_collocation_non_penalty = -6.0
sentence_collocation_weak_penalty = -100.0
sentence_collocation_rear_penalty = -18.0

#
# 网络代理：模型下载、更新检查等需要联网的功能共用。
# proxy_mode：system 跟随系统代理设置 / none 不使用代理（直连）/ custom 使用下面的 HTTP 代理。
# proxy_server：custom 模式的 HTTP 代理地址，形如 127.0.0.1:7890；留空时按 system 处理。
#
[network]
proxy_mode = "system"
proxy_server = ""
[frequency_adjustment]
# disabled / pin / halve / linear / promote
mode = "promote"
# 每选中几次执行一次调频，范围 1~10
trigger_count = 1
# 线性调频每次前移数量，范围 1~10
linear_step = 1

#
# Appearance
# 外观
#
[appearance]
# 主题模式，可选："dark", "light", "system"
theme_mode = "system"
# 设置窗口关闭后在后台驻留多久再退出，驻留期间重新打开无需冷启动
# 可选："off"（立即退出）, "1m", "5m", "10m", "30m", "60m", "forever"（一直驻留）
settings_window_linger = "off"
# 打开设置窗口时先显示居中的齿轮启动画面，再淡入主界面
settings_launch_animation = true
# 发现新版本时由后台自动下载安装包并校验 SHA256。关闭后只在关于页提示新版本。
# 后台只在输入法进程运行时工作，且只对正式版生效，nightly 与 dev 构建不参与。
auto_download_update = false
# 分表面主题，可选："follow", "dark", "light"（follow = 跟随 theme_mode）
theme_settings = "follow"
theme_cand = "follow"
theme_ftb = "follow"
theme_menu = "follow"
# 字体（中文）
font = "Noto Sans SC"
# 英文字体（拉丁字母优先使用；汉字仍回落到 font）
english_font = "Segoe UI"
# 缺省字体，如果系统中没有找到指定字体，则使用缺省字体
default_font = "Microsoft YaHei"
# 主字体缺字时依次使用这些补充字体，最后回落到系统字体；[] 表示仅使用系统回落。
fallback_fonts = ["Noto Sans SC", "Microsoft YaHei"]
# 字体大小（px），可选：12–32
font_size = 16
# 候选窗口顶部预编辑字号（px），可选：12–32
candidate_window_preedit_font_size = 16
# 候选文字颜色，"auto" 跟随主题，或 #RRGGBB
cand_text_color = "auto"
# 每页候选词数量，可选：3, 4, 5, 6, 7, 8, 9
page_size = 8
# 候选窗口严格按文字所需的宽度收紧，不垫出厂最小宽度；皮肤 skin.toml 的 fit_content 打开时始终收紧
candidate_window_fit_content = false
# 候选窗口跟随光标
candidate_window_follow_cursor = true
# 候选窗口排列方式，可选："vertical", "horizontal"
candidate_window_layout = "vertical"
# 横向排列时强制单行：候选窗口最宽可到当前屏幕宽度，放不下才换行；关闭时最宽为屏幕一半
candidate_window_single_line = false
# 候选窗口与悬浮工具栏皮肤，内置 "fluent"（原装），随包提供 "acrylic"（亚克力），也可以写外部皮肤的 id
candidate_skin = "fluent"
# 候选窗口顶部预编辑，可选："pinyin", "empty"
#   pinyin -> 显示分词预编辑（与候选框当前行为一致）
#   empty  -> 隐藏顶部预编辑行
candidate_window_preedit_style = "pinyin"
# 固定排位候选词是否显示徽标
candidate_fixed_badge = true
# 固定排位候选词徽标样式，可选："paperclip", "pushpin", "dot"
candidate_fixed_badge_style = "paperclip"
# TSF 行内预编辑样式，可选："raw", "pinyin", "empty"
#   raw    -> 原始按键序列
#   pinyin -> 分词后的拼音序列（Server 回包 Preedit）
#   empty  -> 行内不显示预编辑
tsf_preedit_style = "raw"
# tsf_preedit_style = "pinyin"
# tsf_preedit_style = "empty"

#
# Language bar
# 语言栏
#
[language_bar]
# 总开关：是否在任务栏语言栏（输入法指示器旁）显示任何按钮。关闭后下面三个子开关一并隐藏，且不注册任何语言栏按钮。
enabled = true
# 是否在任务栏语言栏（输入法指示器旁）显示中/英模式按钮
show_ime_mode = true
# 是否在任务栏语言栏显示全/半角按钮
show_double_single_byte = true
# 是否在任务栏语言栏显示中文标点按钮
show_punctuation = true

#
# Input
# 输入
#
[input]
character_set = "simplified" # 候选输出字形，可选："simplified", "traditional"
# 启动/从其他输入法切换到本输入法时的默认中英文，可选："chinese", "english"
default_ime_mode = "chinese"
# 中英文状态范围，可选："app"（按应用分别记忆）, "global"（所有应用保持统一）
ime_mode_scope = "app"
# 以词定字：开启后，[ 上屏高亮候选的首个汉字，] 上屏末个汉字
word_to_character = false
# brackets: [ / ]; minus_equal: - / =. Mutually exclusive with paging on the same keys.
word_to_character_keys = "brackets"
# 智能标点：中文标点模式下的标点自动转换（总开关，默认关闭）
smart_punctuation = false
# 中文标点后按空格转换：。，！？；：、 以及单独出现的 “ ” 【 】 《 》 （ ） 转为对应英文标点
smart_punctuation_space_convert = false
# 数字后直出：数字后输入 , . : 直接输出英文标点（如 3.14）
smart_punctuation_direct_digit = false
# 字母后直出：字母后输入 , . : 直接输出英文标点
smart_punctuation_direct_letter = false
# 同键转回中文：转换或直出的英文标点，2 秒内再按同一标点键转回中文
smart_punctuation_repeat_to_chinese = false
# 成对标点补全：输入左侧符号时自动补全右侧符号，并将光标置于中间
paired_punctuation = true
# 顿号自定义：中文标点下 \ 和 / 是否输出顿号「、」，至少保留一个；没开的键按原样输出
enumeration_comma_backslash = true
enumeration_comma_slash = true
# 标点锁定，可选："follow"（随中英文切换）, "chinese"（始终中文标点）, "english"（始终英文标点）
punctuation_lock = "follow"
# Vim 模式：在列出的应用里，交给应用的无修饰键 Esc 同时把输入法切到英文。按可执行文件名匹配，不区分大小写，
# 例如 ["Code.exe", "gvim.exe"]；终端里的 Vim 需填终端宿主，同一终端内的其他程序也会受影响
vim_mode_apps = []
# 会话后端，可选："legacy", "engine"；两者都指向同一个全拼引擎会话
# Historical "legacy" values are accepted as an alias for the shared engine.
session_backend = "engine"
# 输入方案，目前只支持 "quanpin"；旧配置里的 "shuangpin" 等值会静默回退全拼
schema = "quanpin"
# 造词时按 Esc：true 只清掉还没选的拼音、保留已选的词，再按一次才整体取消（小狼毫风格）；false 直接整体取消
escape_keeps_selected_word = false
# 回车上屏英文时把该英文单词写入英文词库，下次可作为候选
enter_learns_english_word = true
# 模糊音；默认全部关闭，升级用户零行为变化
# 总开关：关闭时所有规则不生效，已选规则保留，便于临时停用后恢复
fuzzy_pinyin = false
# 播种标记（内部键，勿手改）：首次启用总开关时自动置位；缺失会被升级合并丢弃，导致误重播种
fuzzy_seeded = false
# 声母：开启后两个音互相当作同一个读音匹配
fuzzy_z_zh = false
fuzzy_c_ch = false
fuzzy_s_sh = false
fuzzy_n_l = false
fuzzy_f_h = false
fuzzy_r_l = false
# 韵母：前后鼻音等
fuzzy_an_ang = false
fuzzy_en_eng = false
fuzzy_in_ing = false
fuzzy_ian_iang = false
fuzzy_uan_uang = false

#
# Quanpin
# 全拼
#
[quanpin]
# 全拼自动纠错：遇到按键窜乱时自动按最接近的正确拼音查询候选。
# 仅当输入串不是合法拼音组合时触发，不影响正常输入；四种类型默认全部关闭，
# 可在设置页分别开启。四个开关各管一类手误、互不联动：只开哪个就只纠哪种。
# 旧的单键 autocorrect 已废弃，不再读取；漏字 / 多字两个键是新增的，缺失时按关闭处理。
# 相邻字母顺序打错时纠正（如 sahng → shang）。
autocorrect_transposition = false
# 误触相邻按键时纠正（如 shabg → shang）。
autocorrect_neighbor = false
# 漏敲一个字母时纠正（如 shng → shang）。
autocorrect_deletion = false
# 多敲一个相邻按键时纠正（如 sjhang → shang）。
autocorrect_insertion = false
# 纠错得到的候选在末尾显示 * 标记，便于和正常候选区分；只影响显示，不影响上屏文字。
autocorrect_marker = true

#
# Keybindings
# 快捷键
#
[keybindings]
# 中英文切换快捷键（Ctrl+Space 由 Windows 系统管理，此处不控制）
switch_language_shift = true
switch_language_ctrl = false
switch_language_ctrl_alt_space = true
# 输入状态切换；空字符串表示未绑定；支持 Ctrl 或 Ctrl+Shift 组合键
toggle_english_candidates = "Ctrl+Shift+KeyE"
toggle_full_width = "Ctrl+Shift+Space"
toggle_punctuation = "Ctrl+Period"
# Only active in Chinese mode.
toggle_character_set_ctrl_shift_f = true
# Shift + Enter 提交转换后的全拼；关闭后 Shift + Enter 按 Enter 处理（提交原始输入）
commit_pinyin_shift_enter = true
# 候选词英文上屏：Ctrl+Enter 上屏英文行显示的那个词义；Ctrl+Shift+Enter 展开全部词义的竖排清单。
# 键位只支持 Ctrl / Ctrl+Shift + 一个键名（如 Ctrl+Enter、Ctrl+Shift+Enter、Ctrl+Period）；空字符串表示关闭。
commit_english = "Ctrl+Enter"
english_senses = "Ctrl+Shift+Enter"

#
# Dictionary
# 词库
#
[dictionary]
# 词库路径
dictionary_path = "./assets/dictionaries/msime.db"

#
# Skin
# 皮肤
#
[skin]
# 皮肤名称
skin_name = "default"

#
# Utility
# 实用功能
#
[utility]
clipboard_history = false # 剪贴板历史，仅记录文本；关闭后立即清空
quick_phrase = true # Shift+K 进入快捷短语模式
quick_phrase_candidates = true # 全拼下把编码精确匹配的快捷短语混进候选，排在固定位置候选之后的首位
quick_phrase_frequency = true # 快捷短语参与调频：常越过它选别的候选时整组后退，最多退到首页末位
# 候选混输总开关：关闭后英文（general.cn_en_mixed_input）、emoji（general.emoji_mixed_input）、
# 颜文字（general.kaomoji_mixed_input）、符号（general.symbol_mixed_input）、快捷短语（quick_phrase_candidates）、
# 日期时间（date_time_candidates）都不再混进候选，各自的开关值保留
mixed_candidates = true
date_time_candidates = true # 全拼下输入 rq / riqi / date、sj / shijian / time、xq / xingqi / week 时，把当前日期、时间、星期混进候选
date_time_menu = false # 日期时间混入候选时，在第三位放一个「📅日期」入口，选中后候选框换成全部日期格式（与 Shift+T 模式相同）
radical_mode = true # Shift+U 进入 U 模式（部件拆字反查）：输入部件拼音连写，候选出汉字并反显注音
date_time_mode = true # Shift+T 进入日期与时间快捷输入模式（全拼）
emoji_mode = true # Shift+E 进入 Emoji 快捷输入模式（支持全拼/简拼/英文）
kaomoji_mode = true # Shift+M 进入颜文字快捷输入模式（支持全拼/简拼/英文）
symbol_mode = true # Shift+S 进入符号快捷输入模式：输入分组码（xl 希腊字母、sx 数学、szq 带圈数字、jt 箭头）或符号名（alpha、infinity）
y_mode = true # Shift+Y 进入临时英文模式（中文状态下直接打英文，上屏后回到中文）
v_mode = true # V 模式：V 后接数字转中文（V123 → 一百二十三，V123.45 → 壹佰贰拾叁元肆角伍分）或计算算式（V1+2*3 → 7）；全拼大小写均可
