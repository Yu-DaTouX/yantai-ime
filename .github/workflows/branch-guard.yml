name: Branch guard

# This fork has one mainline, not upstream's develop -> main promotion model.
on:
  pull_request:
    branches: [yudatou/main]

permissions:
  contents: read

jobs:
  base:
    name: Base branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Accept feature pull requests into the fork mainline
        run: echo 'Feature and release branches may target yudatou/main.'
