name: Release
run-name: Release v${{ inputs.version }} (${{ inputs.dry_run && 'dry run' || 'draft only' }})

# Deliberately manual: never merge branches or publish a release automatically.
# Draft creation is restricted to the default branch; branch rehearsals only upload artifacts.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version (MAJOR.MINOR.PATCH, starting at 0.1.0)
        required: true
        type: string
        default: '0.1.0'
      dry_run:
        description: Build/sign/test and upload artifacts only (no tag or release writes)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.request.outputs.tag_name }}
      version: ${{ steps.request.outputs.version }}
      target_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and branch
        id: request
        env:
          TARGET_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: python3 scripts/ci/prepare-release.py
      - name: Require fixed signing credentials
        env:
          SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [[ "$SIGNING_PROVIDER" != certificate ]]; then
            echo '::error::Set WINDOWS_SIGNING_PROVIDER=certificate'
            exit 1
          fi
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo '::error::Fixed certificate secrets are required'
            exit 1
          fi

  validate:
    name: Validate release automation
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -color .github/workflows/release.yml .github/workflows/ci.yml .github/workflows/dev-build.yml .github/workflows/branch-guard.yml .github/workflows/quality.yml
      - name: Test release metadata and draft safety
        run: python3 scripts/ci/test-manual-release.py

  dependencies:
    name: Load the release product lock
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      dictionary_tag: ${{ steps.lock.outputs.dictionary_tag }}
    steps:
      - name: Read dependencies from the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false
      - name: Validate and export the product lock
        id: lock
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/product_lock.py verify-published
          python scripts/product_lock.py outputs --github-output "$GITHUB_OUTPUT"

  tsf:
    name: Build TSF ${{ matrix.name }}
    needs: [prepare, dependencies]
    runs-on: windows-2025
    env:
      VCPKG_ROOT: C:\vcpkg
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            architecture: x64
            triplet: x64-windows-static
            build_dir: windows/build64-release
          - name: Win32
            architecture: Win32
            triplet: x86-windows-static
            build_dir: windows/build32-release
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Trust the runner workspace
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          foreach ($attempt in 1..10) {
              $trusted = git config --global --get-all safe.directory
              if ($trusted -contains $workspace) { exit 0 }
              git config --global --add safe.directory $workspace
              if ($LASTEXITCODE -eq 0) { exit 0 }
              Start-Sleep -Milliseconds (200 * $attempt)
          }
          throw "Could not add $workspace to the global safe.directory list"

      - name: Stamp the version resource
        shell: pwsh
        env:
          TARGET_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python scripts/apply_version.py --version $env:TARGET_VERSION
          python scripts/apply_version.py --version $env:TARGET_VERSION --check

      - name: Verify the vcpkg root
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath (Join-Path $env:VCPKG_ROOT 'vcpkg.exe') -PathType Leaf)) {
            throw "VCPKG_ROOT is '$env:VCPKG_ROOT' but vcpkg.exe is not there"
          }
          if ($env:VCPKG_ROOT -ne $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_ROOT is '$env:VCPKG_ROOT'; the image's VCPKG_INSTALLATION_ROOT is '$env:VCPKG_INSTALLATION_ROOT'"
          }

      - name: Restore dependency binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache
        with:
          scope: tip-${{ matrix.triplet }}

      - name: Install dependencies
        shell: pwsh
        working-directory: windows
        run: |
          & "$env:VCPKG_ROOT\\vcpkg.exe" install --triplet ${{ matrix.triplet }}

      - name: Save dependency binaries before compiling
        if: ${{ steps.vcpkg-cache.outputs.matched-key != format('{0}-complete', steps.vcpkg-cache.outputs.key) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.vcpkg-cache.outputs.key }}-complete

      - name: Configure
        shell: pwsh
        run: >
          cmake -S windows -B ${{ matrix.build_dir }} -A ${{ matrix.architecture }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build
        shell: pwsh
        run: cmake --build ${{ matrix.build_dir }} --config Release --parallel

      - name: Check the TSF binary and symbols the installer expects
        shell: pwsh
        run: ./scripts/ci/check-tsf-dll.ps1 -BuildDir '${{ matrix.build_dir }}'

      - name: Test the wire contract on this architecture
        run: ctest --test-dir ${{ matrix.build_dir }} -C Release --output-on-failure

      - name: Upload the TSF binary and symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsf-${{ matrix.name }}
          path: ${{ matrix.build_dir }}/Release
          if-no-files-found: error

  server:
    name: Build Server
    needs: [prepare, dependencies]
    runs-on: windows-2025
    env:
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
    timeout-minutes: 120
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Trust the runner workspace
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          foreach ($attempt in 1..10) {
              $trusted = git config --global --get-all safe.directory
              if ($trusted -contains $workspace) { exit 0 }
              git config --global --add safe.directory $workspace
              if ($LASTEXITCODE -eq 0) { exit 0 }
              Start-Sleep -Milliseconds (200 * $attempt)
          }
          throw "Could not add $workspace to the global safe.directory list"

      - name: Verify the hosted vcpkg root
        shell: pwsh
        run: |
          $onPath = Get-Command vcpkg.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          $imageRoot = if ($onPath) { Split-Path -Parent $onPath.Source } else { '' }
          if (-not (Test-Path -LiteralPath (Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe') -PathType Leaf) -or
              $imageRoot -ne $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is '$env:VCPKG_INSTALLATION_ROOT' but the image's vcpkg is at '$imageRoot'"
          }

      - name: Restore dependency binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache
        with:
          scope: server-x64-windows-and-static-md

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Boost
        shell: pwsh
        run: ./scripts/ci/install-boost.ps1

      - name: Save Boost binaries before configuring
        if: ${{ steps.vcpkg-cache.outputs.matched-key != format('{0}-complete', steps.vcpkg-cache.outputs.key) && steps.vcpkg-cache.outputs.matched-key != format('{0}-boost', steps.vcpkg-cache.outputs.key) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.vcpkg-cache.outputs.key }}-boost

      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', 'server', '-B', 'server/build-release', '-G', 'Ninja Multi-Config',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
            '-DVCPKG_TARGET_TRIPLET=x64-windows',
            '-DMSIME_PRODUCT_VERSION_OVERRIDE=${{ needs.prepare.outputs.version }}'
          )
          $cmakeArgs += @(./scripts/ci/cmake-sccache-args.ps1 -SetupOutcome '${{ steps.sccache.outcome }}')
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save dependency binaries before compiling
        if: ${{ steps.vcpkg-cache.outputs.matched-key != format('{0}-complete', steps.vcpkg-cache.outputs.key) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.vcpkg-cache.outputs.key }}-complete

      - name: Build
        shell: pwsh
        run: cmake --build server/build-release --config Release --parallel

      - name: Report sccache hit rate
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: sccache --show-stats

      - name: Check the binaries the installer requires
        shell: pwsh
        run: ./scripts/ci/check-server-binaries.ps1 -BuildDir server/build-release/bin/Release

      - name: Test Server with the release's exact dictionaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/test-server.ps1 -ServerRoot server -StagingRoot "$env:RUNNER_TEMP/product-data" -BuildDir build-release

      - name: Embed the Server uiAccess manifest
        shell: pwsh
        run: ./scripts/ci/embed-server-manifest.ps1 -BuildDir server/build-release/bin/Release

      - name: Verify the embedded Server uiAccess manifest
        shell: pwsh
        run: ./scripts/ci/check-server-binaries.ps1 -BuildDir server/build-release/bin/Release

      - name: Upload the Server build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: server/build-release/bin/Release
          if-no-files-found: error

  package:
    name: Package signed installer and prepare draft
    needs: [prepare, validate, dependencies, tsf, server]
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      DICTIONARY_TAG: ${{ needs.dependencies.outputs.dictionary_tag }}
      STAGING_ROOT: .
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false

      - name: Trust the runner workspace
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          foreach ($attempt in 1..10) {
              $trusted = git config --global --get-all safe.directory
              if ($trusted -contains $workspace) { exit 0 }
              git config --global --add safe.directory $workspace
              if ($LASTEXITCODE -eq 0) { exit 0 }
              Start-Sleep -Milliseconds (200 * $attempt)
          }
          throw "Could not add $workspace to the global safe.directory list"

      - name: Check the hosted Inno Setup can compile the installer
        shell: pwsh
        run: ./scripts/ci/check-inno-language.ps1

      - name: Download the x64 TSF binary and symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tsf-x64
          path: windows/build64-release/Release

      - name: Download the 32-bit TSF binary and symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tsf-Win32
          path: windows/build32-release/Release

      - name: Download the Server build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: server/build-release/bin/Release

      - name: Download the dictionaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/download-dictionaries.sh

      - name: Build the word-lattice language model
        shell: pwsh
        run: ./scripts/build-language-model.ps1

      - name: Download the neural sentence models
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-neural-model.ps1

      - name: Decide the signing mode
        id: signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_PROVIDER: certificate
        run: ./scripts/ci/detect-release-signing.ps1

      - name: Collect the installer payload
        shell: pwsh
        working-directory: installer
        env:
          TARGET_VERSION: ${{ needs.prepare.outputs.version }}
        run: >
          pwsh -File ./Prepare-PackageFiles.ps1 -TargetVersion $env:TARGET_VERSION
          -RepoRoot (Resolve-Path '..').Path
          -TsfDirectory windows -ServerDirectory server -NoticesDirectory .
          -IncludeSymbols

      - name: Embed the exact product dependency manifest
        env:
          WINDOWS_COMMIT: ${{ needs.prepare.outputs.target_sha }}
        run: >
          python scripts/product_lock.py manifest
          --windows-commit "$env:WINDOWS_COMMIT"
          --output installer/app_data/product-manifest.json

      - name: Sign the payload binaries
        shell: pwsh
        working-directory: installer
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: ../scripts/ci/sign-binaries.ps1 -Recurse -Path 'server_exe', 'tsf_dll'

      - name: Install the Chinese language file for Inno Setup
        shell: pwsh
        run: ./scripts/ci/install-inno-language.ps1

      - name: Compile the installer
        shell: pwsh
        working-directory: installer
        run: pwsh -File ./Compile-Installer.ps1

      - name: Sign the installer
        shell: pwsh
        working-directory: installer
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
          TARGET_VERSION: ${{ needs.prepare.outputs.version }}
        run: ../scripts/ci/sign-binaries.ps1 -Path "Output/MetasequoiaIME_Setup_v$env:TARGET_VERSION.exe"

      - name: Name the asset and record its checksum
        id: asset
        shell: pwsh
        working-directory: installer
        env:
          TARGET_VERSION: ${{ needs.prepare.outputs.version }}
          ASSET_SUFFIX: ${{ steps.signing.outputs.asset_suffix }}
        run: ../scripts/ci/name-installer-asset.ps1

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            ${{ steps.asset.outputs.asset_path }}
            installer/app_data/product-manifest.json
          if-no-files-found: error

      - name: Prepare assets and optionally create an unpublished draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          ASSET_PATH: ${{ steps.asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.asset.outputs.asset_name }}
          ASSET_SHA256: ${{ steps.asset.outputs.asset_sha256 }}
          SIGNING_ENABLED: ${{ steps.signing.outputs.signing_enabled }}
          PRODUCT_MANIFEST: installer/app_data/product-manifest.json
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: bash scripts/ci/publish-release.sh

      - name: Upload the complete release assets for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
